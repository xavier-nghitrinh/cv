<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen flex flex-col">

    <!-- Header / Navbar -->
    <header class="bg-slate-800 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center flex-wrap gap-2">
            <a href="/" class="text-xl font-bold flex items-center gap-2">
                <i class="fa-solid me fa-briefcase text-blue-400"></i> Job Application AI Assistant
            </a>
            <div class="flex items-center gap-3">
                <a href="/new" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-2 rounded-md text-sm font-medium transition flex items-center gap-1">
                    <i class="fa-solid fa-plus"></i> New Application
                </a>
                <a href="/profile" class="bg-slate-700 hover:bg-slate-600 text-white px-3 py-2 rounded-md text-sm font-medium transition flex items-center gap-1">
                    <i class="fa-solid fa-user-pen"></i> Edit Profile
                </a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-7xl w-full mx-auto p-4 md:p-6">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-gray-200 border-t border-gray-300 py-4 text-center text-xs text-gray-600 mt-6">
        GCP Cloud Run & Google GenAI (gemini-3.7-flash) | Australian English Standard
    </footer>

</body>
</html>
